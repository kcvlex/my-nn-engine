name: 'Setup CI Environment'
description: 'Shared setup: submodules, Rust, system deps, and model downloads'

inputs:
  models:
    description: 'Space-separated list of model specs: name|url|sha256'
    required: true

runs:
  using: composite
  steps:
    - name: Cache git submodules
      uses: actions/cache@v4
      with:
        path: |
          .git/modules
          third-party
        key: ${{ runner.os }}-submodules-${{ hashFiles('.gitmodules') }}
        restore-keys: |
          ${{ runner.os }}-submodules-

    - name: Initialize submodules
      shell: bash
      run: git submodule update --init --recursive

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2

    - name: Install dependencies
      shell: bash
      run: |
        # Install Protocol Buffers compiler and OpenBLAS
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler libopenblas-dev

        # Install LLVM 18
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-18 main"
        sudo apt-get update
        sudo apt-get install -y llvm-18 llvm-18-dev llvm-18-runtime clang-18 clang-tools-18 lld-18 libpolly-18-dev libomp-18-dev
        echo "LLVM_SYS_180_PREFIX=/usr/lib/llvm-18" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=/usr/lib/llvm-18/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> $GITHUB_ENV

    - name: Hash requested models
      id: model-hash
      shell: bash
      run: echo "hash=$(echo '${{ inputs.models }}' | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT

    - name: Cache validated model archives
      uses: actions/cache@v4
      with:
        path: models/validated/*.tar.gz
        key: ${{ runner.os }}-validated-model-archives-${{ steps.model-hash.outputs.hash }}
        restore-keys: |
          ${{ runner.os }}-validated-model-archives-

    - name: Download and extract validated models
      shell: bash
      working-directory: models/validated
      run: |
        download_model() {
          local name=$1
          local url=$2
          local expected_sha256=$3

          if [ ! -f "${name}.tar.gz" ]; then
            echo "Downloading $name..."
            wget -q -O "${name}.tar.gz" "$url"

            echo "Verifying checksum for $name..."
            echo "${expected_sha256}  ${name}.tar.gz" | sha256sum -c - || {
              echo "Checksum verification failed for $name"
              rm "${name}.tar.gz"
              exit 1
            }
          else
            echo "$name.tar.gz found in cache, skipping download..."
          fi

          if [ ! -d "$name" ]; then
            echo "Extracting $name..."
            tar -xzf "${name}.tar.gz"
          else
            echo "$name directory already exists, skipping extraction..."
          fi
        }

        MODELS="${{ inputs.models }}"
        for spec in $MODELS; do
          IFS='|' read -r name url sha256 <<< "$spec"
          download_model "$name" "$url" "$sha256"
        done
