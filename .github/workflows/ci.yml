name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  ONNX_MODELS_HASH: bec48b6a70e5e9042c0badbaafefe4454e072d08
  ONNX_MODELS_REPO: https://github.com/onnx/models

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          models: >-
            mnist-12|${{ env.ONNX_MODELS_REPO }}/raw/${{ env.ONNX_MODELS_HASH }}/validated/vision/classification/mnist/model/mnist-12.tar.gz|a53a59dcaca8804a0f6dfda9a3cf2e082979589391dbde73640b60684f1d24e9
            resnet18-v2-7|${{ env.ONNX_MODELS_REPO }}/raw/${{ env.ONNX_MODELS_HASH }}/validated/vision/classification/resnet/model/resnet18-v2-7.tar.gz|a64c111fac5d4e8bebf9246507ec7a92ea1c1596de09fca73bb7f94e9750e316
            resnet152-v2-7|${{ env.ONNX_MODELS_REPO }}/raw/${{ env.ONNX_MODELS_HASH }}/validated/vision/classification/resnet/model/resnet152-v2-7.tar.gz|78b507483050a427870a264c398d121f44b92d69c8ca0c53217eb5137b6b51e3
            bertsquad-12|${{ env.ONNX_MODELS_REPO }}/raw/${{ env.ONNX_MODELS_HASH }}/validated/text/machine_comprehension/bert-squad/model/bertsquad-12.tar.gz|4cd041010ab4ad11c23c0eb7f056c4e4286a894b6d712ef09445b955763fb1b1
            yolov4|${{ env.ONNX_MODELS_REPO }}/raw/${{ env.ONNX_MODELS_HASH }}/validated/vision/object_detection_segmentation/yolov4/model/yolov4.tar.gz|7d06db57b6b4fff4f75dd3bd16f29b32faec4552d763869d5a3c37d25542cbb2
            gpt2-10|${{ env.ONNX_MODELS_REPO }}/raw/${{ env.ONNX_MODELS_HASH }}/validated/text/machine_comprehension/gpt-2/model/gpt2-10.tar.gz|0c9b81350c95cf2f40e8e72f76792ef6b3c73894beee571171739079330aad53

      - name: Build (CPU-only)
        run: cargo build --no-default-features --verbose

      - name: Run tests (CPU-only)
        run: cargo test --no-default-features --verbose

      - name: Build with all features
        run: cargo build --all-features --verbose

      - name: Check that CUDA feature compiles
        run: cargo check --features cuda --verbose

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt -- --check

  ui-test:
    name: UI Crate Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          models: >-
            mnist-12|${{ env.ONNX_MODELS_REPO }}/raw/${{ env.ONNX_MODELS_HASH }}/validated/vision/classification/mnist/model/mnist-12.tar.gz|a53a59dcaca8804a0f6dfda9a3cf2e082979589391dbde73640b60684f1d24e9

      - name: Run tests
        run: cargo test -p my-onnx-ui --no-default-features --verbose

  frontend-lint:
    name: Frontend Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/my-onnx-ui/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/my-onnx-ui/frontend/pnpm-lock.yaml

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate protobuf types
        run: pnpm generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint
