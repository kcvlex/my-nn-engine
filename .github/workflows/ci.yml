name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Pre-Merge / Engine Crate / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          models: mnist-12 resnet18-v2-7 resnet152-v2-7 mobilenetv2-12 efficientnet-lite4-11 bertsquad-12 yolov4 gpt2-10

      - name: Build (CPU-only)
        run: cargo build --no-default-features --verbose

      - name: Run tests (CPU-only)
        run: cargo test --no-default-features --verbose

  fmt:
    name: Pre-Merge / Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt -- --check

  ui-test:
    name: Pre-Merge / UI Crate / Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          models: mnist-12

      - name: Run tests
        run: cargo test -p my-nn-engine-ui --no-default-features --verbose

  llm-test:
    name: Pre-Merge / LLM Crate / Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        with:
          models: ""

      - name: Run tests
        run: cargo test -p my-nn-engine-llm --no-default-features --verbose

  frontend-lint:
    name: Pre-Merge / UI Crate / Frontend Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/ui/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/ui/frontend/pnpm-lock.yaml

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate protobuf types
        run: pnpm generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint (eslint)
        run: pnpm lint

      - name: Lint (knip dead-code)
        run: pnpm lint:knip

      - name: Unit tests
        run: pnpm test

  frontend-build:
    name: Pre-Merge / UI Crate /Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/ui/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/ui/frontend/pnpm-lock.yaml

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate protobuf types
        run: pnpm generate

      - name: Build
        run: pnpm exec vue-tsc && pnpm exec vite build
