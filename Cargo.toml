[package]
name = "my-onnx"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1.7.1"
id-arena = "2.2.1"
image = "0.25.5"
inkwell = { version = "0.5.0", features = ["llvm18-0-prefer-static"] }
itertools = "0.13.0"
libloading = "0.8.6"
ndarray = "0.16.0"
num-integer = "0.1.46"
prost = "0.13.1"
rand = { version = "0.8.5", features = ["small_rng"] }
strum = "0.26.3"
strum_macros = "0.26.4"

[build-dependencies]
prost-build = "0.13.1"
