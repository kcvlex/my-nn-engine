[workspace]
resolver = "2"
members = [".", "crates/bench", "crates/llm", "crates/test-tools", "crates/ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "CC0-1.0"
repository = "https://github.com/kcvlex/my-onnx-runtime"
authors = ["kcvlex <krkr9893@gmail.com>"]

[workspace.dependencies]
itertools = "0.14.0"
libloading = "0.9"
log = "0.4.29"
memmap2 = "0.9"
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.15.0"

[package]
name = "my-nn-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["cuda", "local"]
cuda = []
local = []

[dependencies]
bitvec = "1.0.1"
bytes = "1.7.1"
delegate = "0.13.4"
derive_more = { version = "2.0.1", features = ["from"] }
id-arena = "2.2.1"
image = "0.25.5"
indexmap = "2.7.1"
inkwell = { version = "0.5.0", features = ["llvm18-0-prefer-static"] }
itertools = { workspace = true }
libloading = { workspace = true }
memmap2 = { workspace = true }
env_logger = "0.11"
log = { workspace = true }
ndarray = "0.16.0"
num = "0.4.3"
num-integer = "0.1.46"
prost = "0.13.1"
rand = { version = "0.8.5", features = ["small_rng"] }
rayon = "1.10.0"
serde = { workspace = true }
smallvec = "1.15.0"
strum = "0.26.3"
strum_macros = "0.26.4"
tempfile = { workspace = true }
typed-builder = "0.21.0"

[build-dependencies]
prost-build = "0.13.1"

[dev-dependencies]
insta = { version = "1.43.1", features = ["yaml"] }
serial_test = "3"
