[package]
name = "my-onnx"
version = "0.1.0"
edition = "2021"

[dependencies]
bitvec = "1.0.1"
bytes = "1.7.1"
delegate = "0.13.4"
derive_more = { version = "2.0.1", features = ["from"] }
id-arena = "2.2.1"
image = "0.25.5"
indexmap = "2.7.1"
inkwell = { version = "0.5.0", features = ["llvm18-0-prefer-static"] }
itertools = "0.13.0"
libloading = "0.8.6"
log = "0.4.29"
ndarray = "0.16.0"
num = "0.4.3"
num-integer = "0.1.46"
prost = "0.13.1"
rand = { version = "0.8.5", features = ["small_rng"] }
rayon = "1.10.0"
serde = "1.0.219"
serde_derive = "1.0.219"
smallvec = "1.15.0"
strum = "0.26.3"
strum_macros = "0.26.4"
tempfile = "3.15.0"
typed-builder = "0.21.0"

# Web server dependencies (optional, for web frontend)
axum = { version = "0.7", features = ["multipart"], optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
serde_json = { version = "1.0", optional = true }
tower-http = { version = "0.5", features = ["fs", "cors"], optional = true }
sha2 = { version = "0.10", optional = true }
tower = { version = "0.4", optional = true }
uuid = { version = "1.0", features = ["v4"], optional = true }
env_logger = { version = "0.11", optional = true }

[features]
default = []
web-server = ["axum", "tokio", "serde_json", "tower-http", "sha2", "tower", "uuid", "env_logger"]

[build-dependencies]
prost-build = "0.13.1"

[dev-dependencies]
insta = { version = "1.43.1", features = ["yaml"] }
