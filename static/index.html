<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONNX Inference Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .subtitle {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            border: none;
            background: transparent;
            font-size: 1rem;
        }

        .tab:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .tab.active {
            background: white;
            border-bottom: 3px solid #667eea;
        }

        .tab-content {
            display: none;
            padding: 30px;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="file"],
        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1rem;
            transition: border 0.3s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 120px;
            font-family: 'Courier New', monospace;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }

        .error {
            background: #fee;
            border-left-color: #f44;
            color: #c00;
        }

        .success {
            background: #efe;
            border-left-color: #4a4;
            color: #060;
        }

        .model-list {
            list-style: none;
        }

        .model-item {
            padding: 15px;
            margin-bottom: 10px;
            background: #f9f9f9;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .model-info {
            flex: 1;
        }

        .model-id {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            color: #667eea;
            font-weight: 600;
        }

        .model-status {
            padding: 4px 12px;
            background: #4caf50;
            color: white;
            border-radius: 12px;
            font-size: 0.85rem;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 ONNX Inference Server</h1>
            <p class="subtitle">Upload ONNX models and run inference locally</p>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('upload')">Upload Model</button>
            <button class="tab" onclick="switchTab('inference')">Run Inference</button>
            <button class="tab" onclick="switchTab('models')">My Models</button>
        </div>

        <!-- Upload Tab -->
        <div id="upload-tab" class="tab-content active">
            <h2>Upload ONNX Model</h2>
            <form id="upload-form">
                <div class="form-group">
                    <label>Model File (.onnx)</label>
                    <input type="file" id="model-file" accept=".onnx" required>
                </div>

                <div class="form-group">
                    <label>Target</label>
                    <select id="target">
                        <option value="CPU">CPU</option>
                        <option value="CUDA">CUDA (GPU)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="optimize" checked> Enable Optimizations
                    </label>
                </div>

                <button type="submit">Upload & Compile</button>
            </form>
            <div id="upload-result"></div>
        </div>

        <!-- Inference Tab -->
        <div id="inference-tab" class="tab-content">
            <h2>Run Inference</h2>
            <form id="inference-form">
                <div class="form-group">
                    <label>Model ID</label>
                    <input type="text" id="model-id" placeholder="Paste model ID from upload" required>
                </div>

                <div class="form-group">
                    <label>Input Tensors (JSON)</label>
                    <textarea id="input-tensors" placeholder='[
  {
    "name": "input",
    "data": [0.1, 0.2, 0.3, ...],
    "dims": [1, 3, 224, 224],
    "dtype": "Float(F32)"
  }
]'></textarea>
                    <small style="color: #666;">Enter input tensors as JSON array. Data should be flattened.</small>
                </div>

                <button type="submit">Run Inference</button>
            </form>
            <div id="inference-result"></div>
        </div>

        <!-- Models Tab -->
        <div id="models-tab" class="tab-content">
            <h2>Cached Models</h2>
            <button onclick="loadModels()" style="margin-bottom: 20px;">Refresh</button>
            <ul id="models-list" class="model-list"></ul>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');

            // Load models when switching to models tab
            if (tabName === 'models') {
                loadModels();
            }
        }

        // Upload form handler
        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('upload-result');
            resultDiv.innerHTML = '<div class="result">Uploading and compiling model... <span class="loading"></span></div>';

            const formData = new FormData();
            formData.append('file', document.getElementById('model-file').files[0]);
            formData.append('target', document.getElementById('target').value);
            formData.append('optimize', document.getElementById('optimize').checked);

            try {
                const response = await fetch('/models/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>✓ ${data.message}</h3>
                            <p><strong>Model ID:</strong> <span class="model-id">${data.model_id}</span></p>
                            <p>Copy this ID to use in the Inference tab.</p>
                        </div>
                    `;
                } else {
                    throw new Error(data.error || 'Upload failed');
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error"><strong>Error:</strong> ${error.message}</div>`;
            }
        });

        // Inference form handler
        document.getElementById('inference-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultDiv = document.getElementById('inference-result');
            resultDiv.innerHTML = '<div class="result">Running inference... <span class="loading"></span></div>';

            const modelId = document.getElementById('model-id').value;
            let inputs;

            try {
                inputs = JSON.parse(document.getElementById('input-tensors').value);
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error"><strong>Error:</strong> Invalid JSON format</div>`;
                return;
            }

            try {
                const response = await fetch(`/models/${modelId}/infer`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ inputs })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>✓ Inference Complete</h3>
                            <p><strong>Time:</strong> ${data.inference_time_ms.toFixed(2)} ms</p>
                            <h4>Outputs:</h4>
                            <pre>${JSON.stringify(data.outputs, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    throw new Error(data.error || 'Inference failed');
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error"><strong>Error:</strong> ${error.message}</div>`;
            }
        });

        // Load models list
        async function loadModels() {
            const listDiv = document.getElementById('models-list');
            listDiv.innerHTML = '<div class="result">Loading models... <span class="loading"></span></div>';

            try {
                const response = await fetch('/models');
                const models = await response.json();

                if (models.length === 0) {
                    listDiv.innerHTML = '<p style="color: #666; padding: 20px; text-align: center;">No models uploaded yet.</p>';
                    return;
                }

                listDiv.innerHTML = models.map(model => `
                    <li class="model-item">
                        <div class="model-info">
                            <div class="model-id">${model.model_id}</div>
                            <small style="color: #666;">Uploaded: ${model.uploaded_at}</small>
                        </div>
                        <span class="model-status">${model.status}</span>
                    </li>
                `).join('');
            } catch (error) {
                listDiv.innerHTML = `<div class="result error"><strong>Error:</strong> ${error.message}</div>`;
            }
        }

        // Load models on page load
        loadModels();
    </script>
</body>
</html>
