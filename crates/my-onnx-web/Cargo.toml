[package]
name = "my-onnx-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "web-server"
path = "src/main.rs"

[dependencies]
my-onnx = { path = "../.." }

# Web server dependencies
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.0", features = ["full"] }
serde = "1.0.219"
serde_json = "1.0"
serde_derive = "1.0.219"
tower-http = { version = "0.5", features = ["fs", "cors"] }
sha2 = "0.10"
tower = "0.4"
uuid = { version = "1.0", features = ["v4"] }
env_logger = "0.11"
log = "0.4.29"
ndarray = "0.16.0"
