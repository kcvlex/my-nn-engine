[package]
name = "my-onnx-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "web-server"
path = "src/main.rs"

[dependencies]
my-onnx = { path = "../.." }

# Web server dependencies (static file serving only)
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
env_logger = "0.11"
log = "0.4.29"

# Required for gRPC service implementation
ndarray = "0.16.0"

# gRPC dependencies
tonic = "0.12"
tonic-web = "0.12"
prost = "0.13.1"
bytes = "1.7.1"
tokio-stream = { version = "0.1", features = ["sync"] }

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13.1"
