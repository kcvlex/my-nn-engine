[package]
name = "my-onnx-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "web-server"
path = "src/main.rs"

[dependencies]
my-onnx = { path = "../.." }

tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
env_logger = "0.11"
log = "0.4.29"

# gRPC dependencies
tonic = "0.12"
tonic-web = "0.12"
prost = "0.13.1"
http = "1"

[build-dependencies]
tonic-build = "0.12"
