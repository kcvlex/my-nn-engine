syntax = "proto3";

package onnx_service;

option optimize_for = LITE_RUNTIME;

import "onnx.proto3";

// Supported model IDs
enum ModelId {
  MNIST = 0;
  RESNET = 1;
  YOLO = 2;
  BERT = 3;
  GPT2 = 4;
  RESNET152 = 5;
  MOBILENETV2 = 6;
  EFFICIENTNET_LITE4 = 7;
}

// Target backend for execution
enum Backend {
  CPU = 0;
  CUDA = 1;
}

// Inference request
message InferenceRequest {
  // Pre-defined model to use
  ModelId model_id = 1;

  // Input tensors
  repeated onnx.TensorProto inputs = 2;

  // Execution backend
  Backend backend = 3;
}

// Inference response
message InferenceResponse {
  // Output tensors
  repeated onnx.TensorProto outputs = 1;

  // Inference time in milliseconds
  double inference_time_ms = 2;
}

// Request to fetch a named initializer (weight tensor) from a model
message GetInitializerRequest {
  ModelId model_id = 1;
  string name = 2;
}

// Response containing the initializer tensor
message GetInitializerResponse {
  onnx.TensorProto tensor = 1;
}

// ===== Chat (LLM) =====

message ChatMessage {
  string role = 1;     // "user" or "assistant"
  string content = 2;
}

// One discoverable model directory under <models_root>/hf/.
// The server only reports the directory name; whether the dir actually
// contains a loadable model is the user's responsibility.
message LlmModelInfo {
  string dir_name = 1;
}

message ListLlmModelsRequest {}

message ListLlmModelsResponse {
  repeated LlmModelInfo models = 1;
}

message CreateChatSessionRequest {
  // Directory name under <models_root>/hf/. Must not contain '/' or '..'.
  string model_dir = 1;
  Backend backend = 2;
}

message CreateChatSessionResponse {
  string session_id = 1;
  double build_time_ms = 2;
}

message ChatRequest {
  string session_id = 1;
  string user_message = 2;
  uint32 max_tokens = 3;  // 0 → use server default
}

message ChatResponse {
  string assistant_message = 1;
  uint32 tokens_generated = 2;
  double generation_time_ms = 3;
  bool eos_emitted = 4;   // false if generation stopped at max_tokens
}

message DestroyChatSessionRequest {
  string session_id = 1;
}

message DestroyChatSessionResponse {}

// Pre-build (compile + cache) a session so subsequent inference calls do not
// pay the kernel-compilation cost on the first request.
message WarmUpRequest {
  ModelId model_id = 1;
  Backend backend = 2;
}

message WarmUpResponse {
  // Wall time spent building the session (0 if already cached).
  double build_time_ms = 1;
}

// ONNX Model Inference Service
service OnnxInferenceService {
  // Run inference on a pre-defined model
  rpc RunInference(InferenceRequest) returns (InferenceResponse);

  // Fetch a named initializer (weight tensor) from a model
  rpc GetInitializer(GetInitializerRequest) returns (GetInitializerResponse);

  // Compile and cache a session without running inference.
  rpc WarmUp(WarmUpRequest) returns (WarmUpResponse);

  // ----- LLM chat -----

  // List directories under <models_root>/hf/ available for chat. Does not
  // verify whether each directory actually contains a loadable model; that's
  // checked at CreateChatSession time.
  rpc ListLlmModels(ListLlmModelsRequest) returns (ListLlmModelsResponse);

  // Build the LlmSession for (model_dir, backend) and return a session id
  // used by subsequent Chat / DestroyChatSession calls. Stateful: the server
  // keeps the KV cache across turns of the same session.
  rpc CreateChatSession(CreateChatSessionRequest)
      returns (CreateChatSessionResponse);

  // Send one user message to a chat session and receive the model's reply.
  rpc Chat(ChatRequest) returns (ChatResponse);

  // Free server-side state associated with a chat session.
  rpc DestroyChatSession(DestroyChatSessionRequest)
      returns (DestroyChatSessionResponse);
}
