[package]
name = "my-nn-engine-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "web-server"
path = "src/main.rs"

[features]
default = ["cuda", "local"]
cuda = ["my-nn-engine/cuda", "my-nn-engine-llm/cuda"]
local = ["my-nn-engine/local", "my-nn-engine-llm/local"]

[dependencies]
my-nn-engine = { path = "../..", default-features = false }
my-nn-engine-llm = { path = "../llm", default-features = false }

tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
futures-core = "0.3"
tower-http = { version = "0.5", features = ["cors"] }
env_logger = "0.11"
log = { workspace = true }
uuid = { version = "1", features = ["v4"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
serde = { workspace = true }
serde_json = "1"

# gRPC dependencies
tonic = "0.12"
tonic-web = "0.12"
prost = "0.13.1"
http = "1"
clap = { version = "4.6.1", features = ["derive", "env"] }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
tonic-build = "0.12"
